<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=860, initial-scale=1"><title>무드등가습기 행사기한</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff}.banner{width:860px;height:150px;display:flex;align-items:center;justify-content:center;background:#fff;overflow:hidden}.highlight{position:relative;display:flex;align-items:center;justify-content:center;height:100px}.highlight::before{content:"";position:absolute;left:0;right:0;top:17px;bottom:9px;background:#fff593}#deadlineText{position:relative;display:inline-block;white-space:nowrap;color:#000;font-family:Pretendard,sans-serif;font-size:72px;font-weight:800;line-height:100px;transform-origin:center;animation:blink 6s linear infinite}@keyframes blink{0%{opacity:1}8%{opacity:0}17%{opacity:1}100%{opacity:1}}
</style></head><body><div class="banner"><div class="highlight"><span id="deadlineText"></span></div></div>
<script>
(async()=>{window.bannerReady=false;const parts=new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',year:'numeric',month:'numeric',day:'numeric',weekday:'short'}).formatToParts(new Date());const value=type=>parts.find(p=>p.type===type).value;const text=document.getElementById('deadlineText');text.textContent=value('year')+'년 '+value('month')+'월 '+value('day')+'일('+value('weekday')+')까지';await document.fonts.load('800 72px Pretendard',text.textContent);await document.fonts.ready;const width=text.getBoundingClientRect().width;const scale=Math.min(1,780/width);text.style.transform='scaleX('+scale+')';document.querySelector('.highlight').style.width=Math.min(width,780)+'px';window.bannerReady=true;})();
</script></body></html>
