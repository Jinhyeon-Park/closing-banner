name: Generate GIFs Daily
on:
  schedule:
    - cron: '5 15 * * *' # 매일 한국시간 00:05, 지연될 수 있음
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: closing-banner-daily
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Seoul
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-save puppeteer@25.16.0 gif-encoder-2@1.0.5 pngjs@7.0.0
      - name: Install Chrome dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgbm-dev
      - name: Generate GIF
        run: node generate-gifs.js
      - name: Commit and push GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index-1.gif mood-deadline.gif
          if ! git diff --staged --quiet; then
            git commit -m "Update closing banner - $(date +'%Y-%m-%d')"
            git push
          fi
      # Bot commits alone do not trigger branch-based Pages builds.
      - name: Publish updated main branch to GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api --method POST "repos/$GH_REPO/pages/builds"
